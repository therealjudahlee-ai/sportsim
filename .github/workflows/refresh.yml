name: Log predictions & grade results

on:
  schedule:
    # 13:41 and 21:41 UTC = morning + ~1h before evening tip-offs (ET)
    - cron: "41 13 * * *"
    - cron: "41 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m jobs.refresh
      - name: Commit prediction log
        run: |
          git config user.name "sportsim-bot"
          git config user.email "sportsim-bot@users.noreply.github.com"
          git add predictions/*.csv
          git diff --cached --quiet || git commit -m "Prediction log $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
