name: Tune model (backtest)

# Run from GitHub: Actions tab -> "Tune model (backtest)" -> Run workflow.
# Fits the model settings on the last two completed seasons, saves them to
# engine/tuned_params.json (the app picks them up automatically) and writes a
# readable report to backtests/<sport>.txt.

on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Which sport to tune"
        type: choice
        options: [all, nfl, nba, ncaab, ncaaf]
        default: all

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest + tune
        run: |
          mkdir -p backtests
          if [ "${{ inputs.sport }}" = "all" ]; then SPORTS="nfl nba ncaab ncaaf"; else SPORTS="${{ inputs.sport }}"; fi
          for s in $SPORTS; do
            echo "=== $s ==="
            python -m jobs.backtest "$s" --tune 2>&1 | tee "backtests/$s.txt" || echo "$s failed (see backtests/$s.txt)"
          done
      - name: Commit results
        run: |
          git config user.name "sportsim-bot"
          git config user.email "sportsim-bot@users.noreply.github.com"
          git add backtests/ engine/tuned_params.json 2>/dev/null || git add backtests/
          git diff --cached --quiet || git commit -m "Tuned model params $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
